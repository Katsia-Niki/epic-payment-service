spring.application.name=epic-payment-service

spring.mongodb.uri=mongodb://localhost:27017/epic_payment_service
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

random.api.url=https://www.random.org/integers?num=1&min=1&max=100&col=1&base=10&format=plain&rnd=new

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

kafka.topic.create-payment=CREATE_PAYMENT

server.port=8084
