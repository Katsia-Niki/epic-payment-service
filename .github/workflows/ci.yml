name: Spring CI

on:
  push:
    branches:
      - main
      - epic/payment-service
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test
        run: mvn -B clean verify

      - name: Build Docker image
        run: docker build -t epic-payment-service:${{ github.sha }} .